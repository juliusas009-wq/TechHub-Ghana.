name: Update Ghana Tech News

on:
  schedule:
    # Run automatically every 30 minutes
    - cron: "*/30 * * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      # ================================================
      # 1. GET WEBSITE FILES
      # ================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================
      # 2. FETCH AND BUILD NEWS JSON
      # ================================================
      - name: Fetch latest Ghana technology news
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          OUTPUT_FILE = "ghana-tech-news.json"

          # ==================================================
          # NEWS SEARCHES
          # ==================================================

          searches = [
              (
                  "Ghana Tech",
                  "Ghana technology OR Ghana tech OR Ghana digital"
              ),
              (
                  "AI",
                  "Ghana artificial intelligence OR Ghana AI"
              ),
              (
                  "Cybersecurity",
                  "Ghana cybersecurity OR Ghana cyber security"
              ),
              (
                  "FinTech",
                  "Ghana fintech OR Ghana mobile money"
              ),
              (
                  "Startups",
                  "Ghana technology startups OR Ghana startups"
              ),
              (
                  "Digital Innovation",
                  "Ghana digital innovation OR Ghana innovation"
              )
          ]

          articles = []
          seen_links = set()

          # ==================================================
          # FETCH GOOGLE NEWS RSS
          # ==================================================

          for category, search_term in searches:

              encoded_query = urllib.parse.quote(search_term)

              rss_url = (
                  "https://news.google.com/rss/search?"
                  + "q=" + encoded_query
                  + "&hl=en-GH"
                  + "&gl=GH"
                  + "&ceid=GH:en"
              )

              try:
                  request = urllib.request.Request(
                      rss_url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 TechHub-Ghana-NewsBot/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      xml_data = response.read()

                  root = ET.fromstring(xml_data)

                  for item in root.findall(".//item"):

                      title_element = item.find("title")
                      link_element = item.find("link")
                      description_element = item.find("description")
                      pubdate_element = item.find("pubDate")

                      if title_element is None:
                          continue

                      if link_element is None:
                          continue

                      title = (
                          title_element.text or ""
                      ).strip()

                      link = (
                          link_element.text or ""
                      ).strip()

                      description = (
                          description_element.text or ""
                      ).strip()

                      published = (
                          pubdate_element.text or ""
                      ).strip() if pubdate_element is not None else ""

                      if not title or not link:
                          continue

                      if link in seen_links:
                          continue

                      seen_links.add(link)

                      # Remove Google's publisher suffix
                      # when possible.
                      clean_title = title

                      if " - " in clean_title:
                          parts = clean_title.rsplit(
                              " - ",
                              1
                          )

                          if len(parts) == 2:
                              clean_title = parts[0].strip()

                      # ========================================
                      # CREATE ARTICLE
                      # ========================================

                      article = {
                          "title": clean_title,
                          "description": description,
                          "url": link,
                          "category": category,
                          "published": published,
                          "source": "Google News",
                          "fetchedAt": datetime.now(
                              timezone.utc
                          ).isoformat()
                      }

                      articles.append(article)

              except Exception as error:

                  print(
                      f"Could not fetch {category}: {error}"
                  )

          # ==================================================
          # SORT ARTICLES
          # ==================================================

          articles = sorted(
              articles,
              key=lambda article: article.get(
                  "published",
                  ""
              ),
              reverse=True
          )

          # Keep the latest 60 articles
          articles = articles[:60]

          # ==================================================
          # CREATE FINAL JSON
          # ==================================================

          news_data = {
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "count": len(articles),

              "articles": articles
          }

          # ==================================================
          # SAVE JSON
          # ==================================================

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  news_data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Successfully saved {len(articles)} articles."
          )

          print(
              f"Output file: {OUTPUT_FILE}"
          )

          PY

      # ================================================
      # 3. CHECK WHAT WAS GENERATED
      # ================================================
      - name: Show news file information
        run: |
          echo "========================================"
          echo "Ghana Tech News Update"
          echo "========================================"

          if [ -f "ghana-tech-news.json" ]; then
            echo "ghana-tech-news.json created successfully."
            echo ""
            echo "File size:"
            wc -c ghana-tech-news.json
            echo ""
            echo "Article count:"
            python3 -c "import json; print(json.load(open('ghana-tech-news.json', encoding='utf-8'))['count'])"
          else
            echo "ERROR: ghana-tech-news.json was not created."
            exit 1
          fi

      # ================================================
      # 4. SAVE UPDATED NEWS TO GITHUB
      # ================================================
      - name: Commit updated news
        run: |
          git config user.name "TechHub Ghana News Bot"
          git config user.email "actions@github.com"

          git add ghana-tech-news.json

          if git diff --cached --quiet; then
            echo "No new news changes to commit."
          else
            git commit -m "Update Ghana technology news"
            git push
          fi
