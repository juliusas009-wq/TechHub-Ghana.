name: Update Ghana Tech News

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Ghana Tech News JSON
        run: |

          node <<'NODE'

          const fs = require("fs");

          const feeds = [
            {
              name: "Ghana Technology",
              url: "https://news.google.com/rss/search?q=Ghana%20technology&hl=en-GH&gl=GH&ceid=GH:en"
            },
            {
              name: "Ghana AI",
              url: "https://news.google.com/rss/search?q=Ghana%20artificial%20intelligence&hl=en-GH&gl=GH&ceid=GH:en"
            },
            {
              name: "Ghana Cybersecurity",
              url: "https://news.google.com/rss/search?q=Ghana%20cybersecurity&hl=en-GH&gl=GH&ceid=GH:en"
            },
            {
              name: "Ghana FinTech",
              url: "https://news.google.com/rss/search?q=Ghana%20FinTech&hl=en-GH&gl=GH&ceid=GH:en"
            },
            {
              name: "Ghana Startups",
              url: "https://news.google.com/rss/search?q=Ghana%20technology%20startup&hl=en-GH&gl=GH&ceid=GH:en"
            }
          ];


          function decodeEntities(text) {

            return String(text || "")
              .replace(/&amp;/g, "&")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&#x27;/g, "'")
              .replace(/&#(\d+);/g, (_, code) =>
                String.fromCharCode(Number(code))
              );

          }


          function stripHTML(text) {

            return decodeEntities(
              String(text || "")
                .replace(/<!\[CDATA\[/g, "")
                .replace(/\]\]>/g, "")
                .replace(/<[^>]*>/g, " ")
                .replace(/\s+/g, " ")
                .trim()
            );

          }


          function getTag(xml, tag) {

            const regex =
              new RegExp(
                `<${tag}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${tag}>`,
                "i"
              );

            const match =
              xml.match(regex);

            return match
              ? stripHTML(match[1])
              : "";

          }


          function getImage(item) {

            const media =
              item.match(
                /<media:content[^>]+url=["']([^"']+)["']/i
              );

            if (media) {
              return decodeEntities(media[1]);
            }


            const mediaThumbnail =
              item.match(
                /<media:thumbnail[^>]+url=["']([^"']+)["']/i
              );

            if (mediaThumbnail) {
              return decodeEntities(mediaThumbnail[1]);
            }


            const enclosure =
              item.match(
                /<enclosure[^>]+url=["']([^"']+)["']/i
              );

            if (enclosure) {
              return decodeEntities(enclosure[1]);
            }


            const description =
              getTag(
                item,
                "description"
              );


            const image =
              description.match(
                /<img[^>]+src=["']([^"']+)["']/i
              );


            if (image) {
              return decodeEntities(image[1]);
            }


            return "";

          }


          function getItems(xml) {

            const matches =
              xml.match(
                /<item[\s\S]*?<\/item>/gi
              );

            return matches || [];

          }


          function detectCategory(title, description, source) {

            const text =
              (
                title +
                " " +
                description +
                " " +
                source
              ).toLowerCase();


            if (
              text.includes("artificial intelligence") ||
              text.includes(" ai ") ||
              text.includes("machine learning") ||
              text.includes("chatgpt")
            ) {

              return "Artificial Intelligence";

            }


            if (
              text.includes("cybersecurity") ||
              text.includes("cyber security") ||
              text.includes("hacking") ||
              text.includes("data breach")
            ) {

              return "Cybersecurity";

            }


            if (
              text.includes("fintech") ||
              text.includes("mobile money") ||
              text.includes("digital payment") ||
              text.includes("banking technology")
            ) {

              return "Ghana Technology";

            }


            if (
              text.includes("programming") ||
              text.includes("software development") ||
              text.includes("developer") ||
              text.includes("coding")
            ) {

              return "Programming";

            }


            if (
              text.includes("cloud computing") ||
              text.includes("cloud technology")
            ) {

              return "Cloud Computing";

            }


            return "Ghana Technology";

          }


          async function fetchFeed(feed) {

            try {

              const response =
                await fetch(
                  feed.url,
                  {
                    headers: {
                      "User-Agent":
                        "TechHub-Ghana-News-Updater/1.0"
                    }
                  }
                );


              if (!response.ok) {

                console.log(
                  `Feed failed: ${feed.name} - HTTP ${response.status}`
                );

                return [];

              }


              const xml =
                await response.text();


              const items =
                getItems(xml);


              const articles =
                [];


              for (
                const item of items.slice(0, 10)
              ) {

                const title =
                  getTag(
                    item,
                    "title"
                  );


                const link =
                  getTag(
                    item,
                    "link"
                  );


                const description =
                  getTag(
                    item,
                    "description"
                  );


                const pubDate =
                  getTag(
                    item,
                    "pubDate"
                  );


                const source =
                  getTag(
                    item,
                    "source"
                  ) ||
                  feed.name;


                if (
                  !title ||
                  !link
                ) {

                  continue;

                }


                articles.push({

                  title:
                    title
                      .replace(/\s*-\s*[^-]+$/, "")
                      .trim(),

                  description:
                    description ||
                    "Latest technology news and digital innovation story.",

                  category:
                    detectCategory(
                      title,
                      description,
                      source
                    ),

                  source:
                    source,

                  publishedAt:
                    pubDate ||
                    new Date().toISOString(),

                  url:
                    link,

                  image:
                    getImage(item)

                });

              }


              return articles;

            }

            catch (error) {

              console.log(
                `Error fetching ${feed.name}:`,
                error.message
              );

              return [];

            }

          }


          async function main() {

            console.log(
              "Starting TechHub Ghana news update..."
            );


            const results =
              await Promise.all(
                feeds.map(
                  fetchFeed
                )
              );


            let articles =
              results.flat();


            /* =============================================
               REMOVE DUPLICATES
            ============================================== */

            const unique =
              new Map();


            for (
              const article of articles
            ) {

              const key =
                article.url ||
                article.title.toLowerCase();


              if (
                !unique.has(key)
              ) {

                unique.set(
                  key,
                  article
                );

              }

            }


            articles =
              Array.from(
                unique.values()
              );


            /* =============================================
               SORT NEWEST FIRST
            ============================================== */

            articles.sort(
              function (a, b) {

                return (
                  new Date(b.publishedAt) -
                  new Date(a.publishedAt)
                );

              }
            );


            /* =============================================
               KEEP LATEST 30 STORIES
            ============================================== */

            articles =
              articles.slice(
                0,
                30
              );


            /* =============================================
               CREATE JSON
            ============================================== */

            const output = {

              updatedAt:
                new Date().toISOString(),

              source:
                "TechHub Ghana",

              articles:
                articles

            };


            fs.writeFileSync(
              "ghana-tech-news.json",
              JSON.stringify(
                output,
                null,
                2
              ) + "\n"
            );


            console.log(
              `Saved ${articles.length} Ghana Tech stories.`
            );

          }


          main();

          NODE


      - name: Check generated news file
        run: |
          echo "===================================="
          echo "GHANA TECH NEWS FILE"
          echo "===================================="
          cat ghana-tech-news.json


      - name: Commit updated news
        run: |

          git config user.name "TechHub Ghana News Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ghana-tech-news.json

          git diff --cached --quiet || git commit -m "Update Ghana Tech news"

          git push
