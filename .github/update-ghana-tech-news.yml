name: Update Ghana Tech News

on:

  # Run automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual execution from GitHub
  workflow_dispatch:

  # Also run when the updater itself is changed
  push:
    paths:
      - "scripts/update-ghana-tech-news.js"
      - ".github/workflows/update-ghana-tech-news.yml"


permissions:
  contents: write


jobs:

  update-news:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SETUP NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # RUN NEWS UPDATER
      # ==========================================

      - name: Update Ghana Tech News
        run: |
          node scripts/update-ghana-tech-news.js


      # ==========================================
      # CHECK FOR CHANGES
      # ==========================================

      - name: Check for changes
        id: changes
        run: |

          if git diff --quiet -- ghana-tech-news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # ==========================================
      # COMMIT UPDATED NEWS
      # ==========================================

      - name: Commit updated news
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name "TechHub Ghana Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ghana-tech-news.json

          git commit -m "Auto-update Ghana Tech news"

          git push


      # ==========================================
      # NO CHANGES
      # ==========================================

      - name: No new articles
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No new Ghana Tech news was found."
